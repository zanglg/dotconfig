[general]
import = ["themes/nova-dark.toml"]

[cursor]
style = { shape = "Underline" }

[font]
size = 16.0
normal = { family = "Monaspace Argon", style = "Regular" }

[terminal]
osc52 = "CopyPaste"

[mouse]
bindings = [{ mouse = "Right", action = "Paste" }]

[selection]
save_to_clipboard = true

[window]
opacity = 0.80
blur = true

[window.dimensions]
columns = 120
lines = 36
