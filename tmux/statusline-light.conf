# Nova Light status-line layout. Keep in sync with statusline.conf (Nova Dark).
set -g status on
set -g status-position top
set -g status-justify left

# Maximum display widths, not reserved space. Avoid truncating the badge/session
# and simultaneous safety indicators at the default limits (10/40 columns).
set -g status-left-length 32
set -g status-right-length 80

# One flat Nova surface; hierarchy comes from text color, not color blocks.
set -g status-style "bg=#d9d9d9,fg=#909198"

# Brackets mark the session scope; the shared bullet separates its windows.
set -g status-left "#[fg=#909198,bg=#d9d9d9,nobold]["
set -ag status-left "#[fg=#{?client_prefix,#b38c19,#383a42},bold]#S"
set -ag status-left "#[fg=#909198,nobold]] • "

# Conditional safety indicators keep semantic color; separators stay muted.
set -g status-right "#{?synchronize-panes,#[fg=#c72943,bold]SYNC#[fg=#909198,nobold] • ,}"
set -ag status-right "#{?client_prefix,#[fg=#b38c19,bold]PREFIX#[fg=#909198,nobold] • ,}"
set -ag status-right "#{?#{m:copy-mode*,#{pane_mode}},#[fg=#b38c19,bold]COPY#[fg=#909198,nobold] • ,}"
set -ag status-right "#{?window_zoomed_flag,#[fg=#1565c1,bold]ZOOM#[fg=#909198,nobold] • ,}"

# Host and clock are secondary metadata and remain deliberately subdued.
set -ag status-right "#{?#{||:#{SSH_CONNECTION},#{SSH_TTY}},#[fg=#909198]#{=20:host_short} • ,}"
set -ag status-right "#[fg=#909198,nobold]%H:%M  "

# Weight, rather than another accent, distinguishes the current window.
setw -g window-status-style "fg=#909198,bg=#d9d9d9,none"
setw -g window-status-current-style "fg=#383a42,bg=#d9d9d9,bold"
setw -g window-status-format "#I #W"
setw -g window-status-current-format "#I #W"
setw -g window-status-separator "#[fg=#909198,bg=#d9d9d9,nobold] • "
