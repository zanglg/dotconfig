# Shared Nova Dark/Light layout; colors are loaded from extras/palettes/nova.json.
set -g status on
set -g status-position top
set -g status-justify left

# Maximum display widths, not reserved space. Avoid truncating the badge/session
# and simultaneous safety indicators at the default limits (10/40 columns).
set -g status-left-length 32
set -g status-right-length 80

# One flat Nova surface; hierarchy comes from text color, not color blocks.
set -gF status-style "bg=#{@nova-selection},fg=#{@nova-comment}"

# Brackets mark the session scope; the shared bullet separates its windows.
set -g status-left "#[fg=#{@nova-comment},bg=#{@nova-selection},nobold]["
set -ag status-left "#[fg=#{?client_prefix,#{@nova-yellow},#{@nova-foreground}},bold]#S"
set -ag status-left "#[fg=#{@nova-comment},nobold]] • "

# Conditional safety indicators keep semantic color; separators stay muted.
set -g status-right "#{?synchronize-panes,#[fg=#{@nova-red},bold]SYNC#[fg=#{@nova-comment},nobold] • ,}"
set -ag status-right "#{?client_prefix,#[fg=#{@nova-yellow},bold]PREFIX#[fg=#{@nova-comment},nobold] • ,}"
set -ag status-right "#{?#{m:copy-mode*,#{pane_mode}},#[fg=#{@nova-yellow},bold]COPY#[fg=#{@nova-comment},nobold] • ,}"
set -ag status-right "#{?window_zoomed_flag,#[fg=#{@nova-blue},bold]ZOOM#[fg=#{@nova-comment},nobold] • ,}"

# Host and clock are secondary metadata and remain deliberately subdued.
set -ag status-right "#{?#{||:#{SSH_CONNECTION},#{SSH_TTY}},#[fg=#{@nova-comment}]#{=20:host_short} • ,}"
set -ag status-right "#[fg=#{@nova-comment},nobold]%H:%M  "

# Weight, rather than another accent, distinguishes the current window.
setw -gF window-status-style "fg=#{@nova-comment},bg=#{@nova-selection},none"
setw -gF window-status-current-style "fg=#{@nova-foreground},bg=#{@nova-selection},bold"
setw -g window-status-format "#I #W"
setw -g window-status-current-format "#I #W"
setw -g window-status-separator "#[fg=#{@nova-comment},bg=#{@nova-selection},nobold] • "
