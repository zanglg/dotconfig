# Load after themes/nova-dark.conf so these layout/style overrides take precedence.
set -g status on
set -g status-position top
set -g status-justify left

# Maximum display widths, not reserved space. Avoid truncating the badge/session
# and simultaneous safety indicators at the default limits (10/40 columns).
set -g status-left-length 32
set -g status-right-length 80

# Flat Nova background and rounded application badge.
set -g status-style "bg=#2d354e,fg=#b6bac9"

# Reset before appending so reloading never duplicates components.
set -g status-left "#[fg=#1c2131,bg=#5e8eed,bold]  TMUX "
set -ag status-left "#[fg=#5e8eed,bg=#2d354e,nobold]#[default] "
set -ag status-left "#[fg=#{?client_prefix,#d6a75c,#dc6583},bold]#S "
set -ag status-left "#[fg=#6c7693,nobold]• "

# Conditional safety indicators; the clock is the only always-visible item.
set -g status-right "#{?synchronize-panes,#[fg=#dc6583]SYNC • ,}"
set -ag status-right "#{?client_prefix,#[fg=#d6a75c]PREFIX • ,}"
set -ag status-right "#{?#{m:copy-mode*,#{pane_mode}},#[fg=#d6a75c]COPY • ,}"
set -ag status-right "#{?window_zoomed_flag,#[fg=#5e8eed]ZOOM • ,}"

# Show the remote host only when the session carries an SSH environment.
set -ag status-right "#{?#{||:#{SSH_CONNECTION},#{SSH_TTY}},#[fg=#6c7693] #{=20:host_short} • ,}"
set -ag status-right "#[fg=#6c7693] #[fg=#b6bac9]%H:%M  "

# Nova's match color marks the current window without adding another block.
setw -g window-status-style "fg=#6c7693,bg=#2d354e,none"
setw -g window-status-current-style "fg=#afcf59,bg=#2d354e,bold"
setw -g window-status-format "#I #W"
setw -g window-status-current-format "#I #W"
setw -g window-status-separator "#[fg=#6c7693,bg=#2d354e,nobold] • "
