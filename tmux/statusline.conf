# Load after themes/nova-dark.conf so these layout/style overrides take precedence.
set -g status on
set -g status-position top
set -g status-justify left

# Maximum display widths, not reserved space. Avoid truncating the badge/session
# and simultaneous safety indicators at the default limits (10/40 columns).
set -g status-left-length 32
set -g status-right-length 80

# One flat Nova surface; hierarchy comes from text color, not color blocks.
set -g status-style "bg=#2d354e,fg=#6c7693"

# Brackets mark the session scope; the shared bullet separates its windows.
set -g status-left "#[fg=#6c7693,bg=#2d354e,nobold]["
set -ag status-left "#[fg=#{?client_prefix,#d6a75c,#b6bac9},bold]#S"
set -ag status-left "#[fg=#6c7693,nobold]] • "

# Conditional safety indicators keep semantic color; separators stay muted.
set -g status-right "#{?synchronize-panes,#[fg=#dc6583,bold]SYNC#[fg=#6c7693,nobold] • ,}"
set -ag status-right "#{?client_prefix,#[fg=#d6a75c,bold]PREFIX#[fg=#6c7693,nobold] • ,}"
set -ag status-right "#{?#{m:copy-mode*,#{pane_mode}},#[fg=#d6a75c,bold]COPY#[fg=#6c7693,nobold] • ,}"
set -ag status-right "#{?window_zoomed_flag,#[fg=#5e8eed,bold]ZOOM#[fg=#6c7693,nobold] • ,}"

# Host and clock are secondary metadata and remain deliberately subdued.
set -ag status-right "#{?#{||:#{SSH_CONNECTION},#{SSH_TTY}},#[fg=#6c7693]#{=20:host_short} • ,}"
set -ag status-right "#[fg=#6c7693,nobold]%H:%M  "

# Weight, rather than another accent, distinguishes the current window.
setw -g window-status-style "fg=#6c7693,bg=#2d354e,none"
setw -g window-status-current-style "fg=#b6bac9,bg=#2d354e,bold"
setw -g window-status-format "#I #W"
setw -g window-status-current-format "#I #W"
setw -g window-status-separator "#[fg=#6c7693,bg=#2d354e,nobold] • "
