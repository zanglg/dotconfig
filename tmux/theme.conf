# Load Nova's generated tmux theme, then the shared personal layout.
# Both use the same Dark/Light palette from nova.nvim.
# Unknown or unset @nova-theme values fall back to Dark.
if-shell -F '#{==:#{@nova-theme},light}' {
    source-file ~/.config/nova.nvim/extras/tmux/nova-light.conf
} {
    source-file ~/.config/nova.nvim/extras/tmux/nova-dark.conf
}

# Run synchronously so @nova-* options exist before sourcing statusline.conf.
# Pass this server's socket explicitly (works with custom -L/-S sockets).
run-shell -E 'python3 ~/.config/tmux/load-palette.py "#{socket_path}" "#{@nova-theme}"'
source-file ~/.config/tmux/statusline.conf
