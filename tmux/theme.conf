# Nova provides semantic @nova-* colors and non-statusline UI styling.
# Keep our flat statusline layout separate from Nova's generated statusline.
# @nova-theme selects dark/light (also supports -dim and -soft variants).
source-file ~/.config/nova.nvim/extras/tmux/colors.conf
source-file ~/.config/nova.nvim/extras/tmux/ui.conf
source-file ~/.config/tmux/statusline.conf
