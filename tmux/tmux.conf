# ture color support
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# enable extended keys
set -g extended-keys on
# modified keys are reported consistently
set -g extended-keys-format csi-u

# editor mode
setw -g mode-keys vi
set -sg escape-time 0

# prefix key binding
unbind C-b
set -g prefix 'C-y'
bind 'C-y' send-prefix
bind 'C-y' last-window

# new window at current path
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind 'h' split-window -h -c "#{pane_current_path}"
bind 'v' split-window -v -c "#{pane_current_path}"

# display
set  -g base-index                   0                        # start windows numbering at 0
setw -g pane-base-index              1                        # make pane numbering consistent with windows
setw -g automatic-rename             on                       # rename window to reflect current program
set  -g automatic-rename-format      '#{b:pane_current_path}' # automatic rename to current directory
set  -g renumber-windows             on                       # renumber windows when a window is closed
set  -g set-titles                   on                       # set terminal title
set  -g display-panes-time           800                      # slightly longer pane indicators display time
set  -g display-time                 1000                     # slightly longer status messages display time
set  -g status-interval              10                       # redraw status line every 10 seconds

# status line
set -g status on
set -g status-position top
set -g status-justify left
set -g status-left-length 32
set -g status-right-length 20

# Colors from nova.nvim
source-file ~/.config/tmux/themes/nova-dark.conf

# Flat status line with a rounded Nerd Font badge; keep after the generated theme.
set -g status-style "bg=#2d354e,fg=#b6bac9"
set -g status-left \
  "#[fg=#1c2131,bg=#5e8eed,bold]  TMUX #[fg=#5e8eed,bg=#2d354e,nobold]#[default] #[fg=#{?client_prefix,#d6a75c,#dc6583},bold]#S #[fg=#6c7693,nobold]• "
set -g status-right \
  "#[fg=#6c7693] #[fg=#b6bac9]%H:%M  "

# Nova's match color marks the current window without adding another block.
setw -g window-status-style "fg=#6c7693,bg=#2d354e,none"
setw -g window-status-current-style "fg=#afcf59,bg=#2d354e,bold"
setw -g window-status-format "#I #W"
setw -g window-status-current-format "#I #W"
setw -g window-status-separator \
  "#[fg=#6c7693,bg=#2d354e,nobold] • "
