# true color support
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# clipboard integration
set -s set-clipboard on

# enable extended keys
set -g extended-keys on
# modified keys are reported consistently
set -g extended-keys-format csi-u

# editor mode
setw -g mode-keys vi
set -sg escape-time 0

# prefix key binding
unbind C-b
set -g prefix 'C-y'
bind 'C-y' send-prefix
bind 'C-y' last-window

# new window at current path
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind 'h' split-window -h -c "#{pane_current_path}"
bind 'v' split-window -v -c "#{pane_current_path}"

# display
set -g base-index 0                         # start window numbering at 0
setw -g pane-base-index 1                   # start pane numbering at 1
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g renumber-windows on                  # renumber after closing a window
set -g set-titles on                        # set terminal title
set -g display-panes-time 800               # pane indicators: milliseconds
set -g display-time 1000                    # status messages: milliseconds
set -g status-interval 10                   # status redraw: seconds

# Default appearance; change to "light" to persist the Light theme.
set -g @nova-theme "dark"
source-file ~/.config/tmux/theme.conf

# Switch without editing or replacing either status-line theme (prefix + L / D).
bind-key L set-option -g @nova-theme "light" \\; source-file ~/.config/tmux/theme.conf
bind-key D set-option -g @nova-theme "dark" \\; source-file ~/.config/tmux/theme.conf
